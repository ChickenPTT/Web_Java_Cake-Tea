<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - Sugar Petals</title>
    <link rel="stylesheet" href="/user/css/style.css" th:href="@{/user/css/style.css}">
    <link rel="stylesheet" href="/user/css/login-popup.css" th:href="@{/user/css/login-popup.css}">
    <link rel="stylesheet" href="/user/css/reset-password.css" th:href="@{/user/css/reset-password.css}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
</head>
<body class="reset-password-page">
    <div class="reset-password-card">
        <a href="/" class="reset-brand">Sugar Petals</a>
        <h1>Đặt lại mật khẩu</h1>

        <div th:if="${!tokenValid}" class="reset-invalid">
            <p>Link không hợp lệ hoặc đã hết hạn.</p>
            <a href="/">Quay lại trang chủ để yêu cầu link mới</a>
        </div>

        <form th:if="${tokenValid}" id="reset-form" class="reset-form">
            <input type="hidden" id="reset-token" th:value="${token}">
            <input type="password" id="new-password" placeholder="Mật khẩu mới" required minlength="6">
            <input type="password" id="confirm-password" placeholder="Nhập lại mật khẩu mới" required minlength="6">
            <button type="submit">Cập nhật mật khẩu</button>
            <p class="reset-hint">Mật khẩu tối thiểu 6 ký tự</p>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script src="/user/js/notify.js" th:src="@{/user/js/notify.js}"></script>
    <script src="/user/js/reset-password.js" th:src="@{/user/js/reset-password.js}"></script>
</body>
</html>
