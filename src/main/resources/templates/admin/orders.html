<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đơn hàng - Sugar Petals Admin</title>
    <th:block th:replace="~{admin/layout/css :: css}"></th:block>
    <link rel="stylesheet" th:href="@{/admin/css/orders.css}">
</head>
<body>
<div class="container-scroller">
    <div th:replace="~{admin/layout/header :: header}"></div>
    <div class="container-fluid page-body-wrapper">
        <div th:replace="~{admin/layout/menu :: menu('orders')}"></div>
        <div class="main-panel">
            <div class="content-wrapper">
                <div class="page-header">
                    <h3 class="page-title">Quản lý đơn hàng</h3>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/admin}">Bảng điều khiển</a></li>
                            <li class="breadcrumb-item active">Đơn hàng</li>
                        </ol>
                    </nav>
                </div>

                <section class="content admin-orders">
                    <div class="order-stats" id="order-stats"></div>

                    <div class="card rounded shadow order-panel">
                        <div class="card-body">
                            <div class="order-toolbar">
                                <div class="order-filters" id="order-filters">
                                    <button type="button" class="order-filter active" data-status="all">Tất cả</button>
                                    <button type="button" class="order-filter" data-status="Pending">Chờ xử lý</button>
                                    <button type="button" class="order-filter" data-status="Processing">Đang xử lý</button>
                                    <button type="button" class="order-filter" data-status="Preparing">Chuẩn bị</button>
                                    <button type="button" class="order-filter" data-status="Out for Delivery">Đang giao</button>
                                    <button type="button" class="order-filter" data-status="Delivered">Đã giao</button>
                                    <button type="button" class="order-filter" data-status="Cancelled">Đã hủy</button>
                                </div>
                                <div class="order-search">
                                    <i class="mdi mdi-magnify"></i>
                                    <input type="search" id="order-search" placeholder="Tìm mã đơn, tên, email...">
                                </div>
                            </div>
                            <div id="order-list-container" class="order-list-container">
                                <p class="text-center text-muted py-5 mb-0">Đang tải đơn hàng...</p>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{admin/layout/js :: js}"></th:block>
<script th:src="@{/admin/js/orders.js}"></script>
</body>
</html>
