spring.application.name=Backend_Cake-Tea

# Port: Render cấp qua biến môi trường PORT; local mặc định 8080
server.port=${PORT:8080}

# ===== Datasource =====
# Local mặc định MySQL. Trên Render đặt biến SPRING_DATASOURCE_* (PostgreSQL) trong dashboard.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/teaandcake?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ===== JPA / Hibernate =====
# Không set dialect cứng: Hibernate tự nhận theo driver (MySQL local / PostgreSQL Render)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SQL_INIT_MODE:never}

# ===== Admin credentials =====
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}

# ===== Upload directory =====
# LƯU Ý: Render free dùng ổ đĩa tạm thời -> file upload sẽ MẤT khi restart/deploy.
# Muốn giữ ảnh lâu dài cần dùng Cloudinary/S3 (xem DEPLOY_RENDER.md).
app.upload.dir=${APP_UPLOAD_DIR:uploads}

# ===== Multipart upload =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ===== Base URL dùng trong email (đặt lại mật khẩu) =====
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ===== Mail config (SMTP) =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
